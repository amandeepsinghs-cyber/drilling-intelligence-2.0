# Google Cloud Build — Sagar Drishti AI Agent (unified container)
# Builds and deploys to Cloud Run in us-central1 — the only region serving gemini-3.8-live
# (measured 2026-09-26, backend/scratch/region_latency.py). Earlier revision targeted asia-south1.
# Usage (repo root):  gcloud builds submit --config infra/cloudbuild.yaml --project drilling-intelligence-2-509714 .
steps:
  # 1. Build unified container (multi-stage: Node 20 frontend build + Python 3.12 FastAPI backend)
  - name: gcr.io/cloud-builders/docker
    args:
      - "build"
      - "-f"
      - "infra/docker/backend.Dockerfile"
      - "-t"
      - "${_AR}/sagar-drishti:${_TAG}"
      - "-t"
      - "${_AR}/sagar-drishti:latest"
      - "."

  # 2. Push container image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - "push"
      - "--all-tags"
      - "${_AR}/sagar-drishti"

  # 3. Deploy unified application to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_AR}/sagar-drishti:${_TAG}"
      - "--region=${_REGION}"
      - "--service-account=${_RUN_SA}"
      - "--port=8080"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--min-instances=1"
      - "--max-instances=3"
      - "--no-cpu-throttling"
      - "--session-affinity"
      - "--timeout=3600"
      - "--concurrency=40"
      - "--execution-environment=gen2"
      - "--set-env-vars=DI_ENV=cloudrun"
      - "--labels=app=sagar-drishti,env=demo"

substitutions:
  _AR: us-central1-docker.pkg.dev/drilling-intelligence-2-509714/sagar-drishti
  _SERVICE_NAME: sagar-drishti
  _REGION: us-central1
  _TAG: v0-4
  _RUN_SA: sagar-drishti-run@drilling-intelligence-2-509714.iam.gserviceaccount.com

images:
  - "${_AR}/sagar-drishti:${_TAG}"
  - "${_AR}/sagar-drishti:latest"

options:
  logging: CLOUD_LOGGING_ONLY
