# ─────────────────────────────────────────────────────────────────────────────
# MN-SM-DW-01 — CANONICAL SCENARIO FACTS (single source of truth)
# Every number shown in the UI, spoken by the agent, or written in the synthetic
# corpus MUST come from this file (SDD §5.2). Change here first, then brief §3C.
# Provenance: SYNTHETIC (illustrative scenario) unless stated otherwise.
# ─────────────────────────────────────────────────────────────────────────────
schema_version: 1

well:
  id: MN-SM-DW-01
  display_name: "MN-SM-DW-01 (illustrative)"
  basin: "Mahanadi Offshore Deepwater"
  program: "Samudra Manthan (illustrative scenario)"
  location: { lat: 19.45, lon: 87.35, note: "~110 km off Odisha; illustrative coordinates" }
  rig: "Ultra-deepwater drillship"
  water_depth_m: 1620
  air_gap_m: 25
  profile: "near-vertical (MD ≈ TVD in interval of interest)"
  current_section: { hole_size_in: 12.25, mud_type: "SOBM" }
  live_interval_m: { start: 4120, td: 4450 }
  onshore_base: "RTOC (illustrative)"

casing:
  last_shoe: { size: "13-3/8 in", md_m: 3850, fit_ppg: 12.10, fit_sg: 1.45 }
  program:                       # ASSUMED (schematic only) except the 13-3/8 in shoe above
    - { size: "36 in", md_m: 1705, role: conductor }
    - { size: "20 in", md_m: 2650, role: surface }
    - { size: "13-3/8 in", md_m: 3850, role: intermediate }

stratigraphy:
  - id: U1
    top_m: 4000
    base_m: 4150
    name: "Upper Miocene compact marine shale & silty claystone (seal)"
    litho_class: SHALE
    gr_api: [95, 115]
    rdep_ohmm: [2.2, 3.5]
    notes: "On normal compaction trend"
  - id: U2
    top_m: 4150
    base_m: 4195
    name: "Miocene transition zone: calcareous siltstone, thin limestone/dolomitic stringers, overpressured prodelta shale"
    litho_class: SILTSTONE
    dt_us_ft: [88, 108]
    notes: "dxc reversal; DT rises off NCT; Rdeep below NCT; gas trending up"
  - id: U3
    top_m: 4195
    base_m: 4290
    name: "Main pay: Miocene slope-channel turbidite sandstone"
    litho_class: SAND
    gr_api: [38, 52]
    rdep_ohmm: [28, 45]
    notes: "Drilling break; high kick sensitivity at sand top"
  - id: U4
    top_m: 4290
    base_m: 4460
    name: "Basal Miocene / Oligocene argillaceous limestone & dolomitic mudstone"
    litho_class: LIMESTONE
    notes: "ROP drops, torque rises; TD / casing point at 4450 m"

reservoir:                       # U3 main pay — owner-approved 2026-09-26 (spoken/printed values)
  unit: U3
  sand_top_m: 4195
  gwc_m: 4270
  gross_gas_column_m: 75         # 4195 → 4270
  net_to_gross: 0.84
  quartz_pct: 82
  phie_pct: 24.2
  permeability_md: 180
  gas_c1_pct_min: 88             # dry gas: C1 > 88 % of C1–C5
  fluid: "dry gas"
  # Generator-only parameters (ASSUMED; never spoken): Archie + fluid model
  sw_gas_leg: 0.22
  sw_water_leg: 0.95
  rw_ohmm: 0.10                  # gives Rt ≈ 35 ohm·m in the gas leg (Archie, PHIE 0.242, Sw 0.22)
  archie: { a: 1.0, m: 2.0, n: 2.0 }

mudlog:
  bottoms_up_lag_min: 45         # cuttings travel time bit → shakers (owner-approved)
  # Depth lag is DERIVED, never stored: lag_m = ROP (m/hr) × 45/60
  #   at 22 m/hr → 16.5 m · at 12 m/hr → 9 m · at 34 m/hr (drilling break) → 25.5 m

pressure:
  obg_ppg_at_sand_top: 14.0
  obg_sg_at_sand_top: 1.68
  sediment_bulk_density_avg_gcc: 2.1
  pp_shale_normal_ppg: 10.95
  pp_shale_normal_sg: 1.31
  pp_ramp_start_m: 4150
  pp_sand_top_ppg: 11.48
  pp_sand_top_sg: 1.38
  sand_top_m: 4195
  loss_limit: "13-3/8 in shoe FIT 12.10 ppg"
  window_ppg_at_sand: 0.62

mud:
  initial: { mw_ppg: 11.20, mw_sg: 1.34 }
  weighted: { mw_ppg: 11.65, mw_sg: 1.40 }
  yp_lb_100ft2: 18
  pv_cp: 28                      # ASSUMED
  active_system_bbl: 3100
  riser_volume_bbl: 1950
  weight_up_location_m: 4172
  weight_up_duration_h: 3        # ~1.5 circulations; time-compressed in demo

barite:
  formula: "lb/bbl = 1470 * (W2 - W1) / (35 - W2)"
  lb_per_bbl: 28.3
  total_lb: 87700
  total_mt: 39.8
  bags_50kg: 796
  volume_gain_bbl: 60

drilling:
  rop_initial_m_hr: 22
  rop_drilling_break_m_hr: 34
  rop_cap_m_hr: 12
  flow_gpm: 850                  # ASSUMED

ml:                              # model / display config (not measurements)
  kick_horizon_m: 30             # P(kick) and worst-underbalance are computed over the next 30 m
  kick_alarm_threshold: 0.5      # UI turns red / "exceeds alarm threshold" at P(kick) >= 0.5
  pp_lookahead_m: 50             # forecast_pore_pressure default look-ahead & "next 50 m" band on the log
  # ASSUMED model output: probabilistic ML mud-weight recommendation around the deterministic value (mud.weighted.mw_ppg).
  # P10 keeps >= 0.10 ppg over forecast sand PP; P90 keeps ECD below the shoe FIT.
  mw_rec_p10_ppg: 11.58
  mw_rec_p90_ppg: 11.76

checkpoints:                     # brief §3C table
  - md_m: 4120
    label: "Before"
    mw_ppg: 11.20
    ecd_ppg: 11.42
    rop_m_hr: 22
    pp_ppg: 10.95
    p_kick_30m: 0.04
  - md_m: 4172
    label: "Warning point"
    mw_ppg: 11.20
    mw_target_ppg: 11.65
    pp_forecast_ppg: 11.48
    pp_forecast_at_m: 4195
    distance_to_hazard_m: 23
    overbalance_if_unchanged_ppg: -0.28
    overbalance_if_unchanged_psi: -200
    p_kick_30m_if_unchanged: 0.71
    dt_us_ft: 101
    conn_gas_pct: { from: 0.4, to: 1.1 }
  - md_m: 4195
    label: "Sand top (offset kick depth)"
    mw_ppg: 11.65
    ecd_ppg: 11.84
    rop_m_hr: 12
    pp_ppg: 11.48
    overbalance_ppg: 0.17
    overbalance_psi: 120
    p_kick_30m: 0.06
  - md_m: 4205
    label: "Drilling break"
    mw_ppg: 11.65
    ecd_ppg: 12.02
    rop_m_hr: 34
    ecd_fit_margin_ppg: 0.08
    p_kick_30m: 0.05
  - md_m: 4205
    label: "After ROP cap"
    frame_md_m: 4205.125           # first log sample after the break interval (display depth stays 4,205 m)
    mw_ppg: 11.65
    ecd_ppg: 11.86
    rop_m_hr: 12
    ecd_fit_margin_ppg: 0.24
    p_kick_30m: 0.04

triggers:
  T3_PRESSURE_RAMP:
    md_m: 4172
    conditions: { dxc_reversal_from_m: 4160, dt_above_nct_us_ft: 10, conn_gas_pct_min: 1.0, p_kick_min: 0.6 }
    effects: [proactive_alert, ghost_curve_on, distance_to_hazard_on]
  T8_OFFSET_DEPTH:
    md_m: 4195
    conditions: { requires_approved_mw_ppg: 11.65 }
    effects: [proactive_reassurance, ghost_kick_replay]
  T9_DRILLING_BREAK:
    md_m: 4205
    conditions: { rop_jump_pct_min: 40, ecd_fit_margin_max_ppg: 0.10 }
    effects: [proactive_loss_warning, whatif_hint]
  SAFETY_UNDERBAL:
    md_m: any
    conditions: { static_mw_below_pp: true, flow_out_delta_positive_or_pit_gain_bbl: 5 }
    effects: [agent_must_say_flow_check_first]

ids:
  memo_id: "MEMO-SM-2026-09"
  dispatch_ids: ["MC-SM-4172", "RTOC-4172", "EMAIL-4172", "PUSH-4172"]
  wcr_id: "WCR-MN-SM-DW-01 Draft v1.0"

provenance_footer: >-
  Illustrative scenario. Well logs are high-resolution synthetic data generated from
  petrophysical and geomechanical models (Archie, Wyllie, Eaton) calibrated to this scenario;
  drilling, mud-log and chemistry channels, offset reports & SOPs are simulated.
  Plug-in to ONGC data = pilot scope.
