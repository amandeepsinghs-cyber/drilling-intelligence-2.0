[project]
name = "drilling-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Core = what Phase 1 needs to serve frames + physics. Heavier stacks are opt-in extras so
# `uv sync` stays fast on stage laptops: `uv sync --extra ingest --extra ml --extra agent`.
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "pyyaml>=6", "numpy>=2", "pandas>=2.2", "pyarrow>=17",
  "jsonschema>=4.23", "httpx>=0.27",
]
[project.optional-dependencies]
ingest = ["lasio>=0.31", "dlisio>=1.0", "duckdb>=1.1"]                 # real LWD drop-in (Phase 6)
ml = ["scikit-learn>=1.5", "xgboost>=2.1", "shap>=0.46"]              # trained models (Phase 6)
agent = ["google-genai>=1.0", "google-adk>=1.0", "websockets>=13"]    # Gemini Live + ADK (Phase 4)
rag = ["google-genai>=1.0", "google-cloud-aiplatform>=1.70", "reportlab>=4.2"]  # corpus + embeddings (Phase 3)
gcp = ["google-cloud-storage>=2.18", "google-cloud-bigquery>=3.25", "google-cloud-firestore>=2.19",
       "google-api-python-client>=2.140", "google-auth>=2.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
