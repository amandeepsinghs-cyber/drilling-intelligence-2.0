# DI_ENV=local  (SDD §4.2)
env: local
project_id: drilling-intelligence
region: us-central1
offline: false                     # DI_OFFLINE=1 overrides
paths:
  data: data
  scenario: data/scenario
  processed: data/processed
  knowledge: data/knowledge
  state_db: data/state/di2.sqlite
adapters:
  storage: local.storage_fs
  tabular: local.tabular_duckdb
  vector: local.vector_json
  state: local.state_sqlite
  messaging: local.messaging_local
models:                            # PIN EXACT IDS AT BUILD TIME (build.md Phase 4)
  live: "gemini-3.8-live"                      # TODO verify Vertex model ID
  live_thinking: "gemini-3.8-live-extended-thinking"  # optional
  pro: "gemini-3-pro"                          # TODO verify latest GA
  flash: "gemini-3-flash"                      # TODO verify latest GA
  embedding: "gemini-embedding-001"
  embedding_dim: 768
rag:
  top_k_dense: 20
  top_k_final: 5
  md_window_m: 50
  chunk_tokens: [600, 800]
  chunk_overlap: 100
voice:
  input_sample_rate: 16000
  output_sample_rate: 24000
  push_to_talk: true
  fallback_tts: "chirp3-hd hi-IN"
actions:
  email: outbox_eml
  rtoc: in_app
  push: console
  sms_dlt: disabled
